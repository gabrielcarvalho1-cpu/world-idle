<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World Idle</title>
<meta name="description" content="Todos os seus jogos idle num lugar só: abra vários ao mesmo tempo, receba aviso de retorno, avalie e descubra novos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><i class="globe"></i>WORLD IDLE</div>
    <nav class="nav" id="nav" aria-label="Seções"></nav>
    <p class="rail-foot">World Idle · versão 1</p>
  </aside>
  <div class="main">
    <div class="tabs" id="tabs" role="tablist" aria-label="Jogos abertos"></div>
    <main class="view" id="view"></main>
    <div id="frames"></div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
